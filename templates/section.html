{% extends "base.html" %}

{% block title %} {{ section.title }} ⋅ {% endblock title %}

{% block content %}
    <h1 class="title">{{ section.title }}</h1>

    <section>
        {{ section.content | safe }}
    </section>

    {% for page in section.pages %}
        <div class="writing-item">
            <span class="writing-date">{{  page.date }}</span>
            <a href="{{ page.path }}" class="underlined-link">{{ page.title }}</a>
        </div>
    {% endfor %}
{% endblock content %}
