{% extends "base.html" %}

{% block title %} {% endblock title %}

{%block content %}
    <section>
        {{ section.content | safe }}
    </section>

    <section>
        <h1>Posts</h1>

        {% set writings = get_section(path = "writings/_index.md") %}
        {% for writing in writings.pages %}
            <div class="writing-item">
                <span class="writing-date">{{  writing.date }}</span>
                <a href="{{ writing.path }}" class="underlined-link">{{ writing.title }}</a>
            </div>
        {% endfor %}

    </section>
{% endblock content %}
